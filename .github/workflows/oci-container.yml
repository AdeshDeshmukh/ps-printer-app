name: OCI Container Build and Smoke Test

on:
  push:
    branches:
      - feature/cloud-native-oci
      - test/postscript-driver-inventory
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build OCI Image & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OCI Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          tags: ps-printer-app:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record PostScript Driver Inventory
        run: |
          mkdir -p inventory
          docker image inspect ps-printer-app:test \
            --format '{{.Id}} {{.Os}}/{{.Architecture}} {{.Config.User}}' > inventory/image.txt
          git rev-parse HEAD >> inventory/image.txt

          if docker run --rm ps-printer-app:test drivers \
            > inventory/drivers.txt 2> inventory/drivers-stderr.txt; then
            printf 'drivers exit status: 0\n' > inventory/driver-status.txt
          else
            printf 'drivers exit status: %s\n' "$?" > inventory/driver-status.txt
          fi

          docker run --rm -i --entrypoint /bin/sh ps-printer-app:test -s \
            > inventory/files-and-packages.txt 2>&1 <<'INVENTORY'
          id
          rpm -qa | sort

          for dir in /usr/share/ppd /usr/share/cups/model /usr/lib/cups/driver \
            /usr/share/cups/drv /var/lib/ps-printer-app/ppd; do
            printf '\nPPD search directory %s\n' "$dir"
            if [ -d "$dir" ]; then
              ls -ld "$dir"
              find -L "$dir" -type f | sort
            else
              printf 'Directory unavailable\n'
            fi
          done

          printf '\nCUPS server directories\n'
          backend_dir=${BACKEND_DIR:-/usr/lib/ps-printer-app/backend}
          ls -ld /usr/lib/ps-printer-app /usr/lib/cups "$backend_dir" || :
          for path in /usr/lib/ps-printer-app/filter/pdftops \
            /usr/lib/ps-printer-app/filter/foomatic-rip /usr/lib/ps-printer-app/filter/hpps \
            "$backend_dir/snmp" "$backend_dir/dnssd" "$backend_dir/socket" \
            "$backend_dir/ipp" "$backend_dir/ipps" "$backend_dir/lpd" "$backend_dir/usb"; do
            if [ -x "$path" ]; then
              printf 'Executable: %s\n' "$path"
              ls -l "$path"
              ldd "$path" 2>&1 || :
            else
              printf 'Missing or not executable: %s\n' "$path"
            fi
          done
          INVENTORY

      - name: Verify CUPS Backends as the App User
        run: |
          if ! docker run --rm -i --entrypoint /bin/sh ps-printer-app:test -es \
            > inventory/backend-verification.txt 2>&1 <<'VERIFY'
          test "$(id -u)" -eq 1001
          test "$(id -gn)" = lp
          : "${BACKEND_DIR:?PAPPL Retrofit backend directory is unset}"
          test "$(readlink "$BACKEND_DIR/ipps")" = ipp
          for backend in ipp ipps lpd usb snmp socket; do
            path="$BACKEND_DIR/$backend"
            printf 'Checking %s\n' "$path"
            test -x "$path"
            libraries=$(ldd "$path" 2>&1) || { printf '%s\n' "$libraries"; exit 1; }
            printf '%s\n' "$libraries"
            if printf '%s\n' "$libraries" | grep -F 'not found'; then
              exit 1
            fi
          done
          VERIFY
          then
            cat inventory/backend-verification.txt
            exit 1
          fi
          printf 'CUPS backend checks passed for UID 1001, group lp\n'

      - name: Smoke Test OCI Container
        run: |
          host=ps-smoke
          address="$host:8000:127.0.0.1"
          url="http://$host:8000/"
          docker run -d --name ps-test -p 8000:8000 ps-printer-app:test \
            -o "server-hostname=$host" -o server-port=8000 \
            -o log-level=debug -o log-file=- server
          trap 'docker rm -f ps-test >/dev/null 2>&1 || true' EXIT
          sleep 5

          get_result=0
          get_status=$(curl --silent --show-error --max-time 15 \
            --noproxy "$host" --resolve "$address" \
            --dump-header inventory/http-get.headers --output inventory/http-get.body \
            --write-out '%{http_code}' "$url") || get_result=$?
          printf 'GET / returned HTTP %s\n' "$get_status"

          head_result=0
          curl --head --fail --silent --show-error --max-time 15 \
            --noproxy "$host" --resolve "$address" \
            --dump-header inventory/http-head.headers --output /dev/null \
            --write-out 'HEAD / returned HTTP %{http_code}\n' "$url" || head_result=$?

          printf 'curl exit status: HEAD=%s GET=%s\n' "$head_result" "$get_result"
          docker logs ps-test > inventory/pappl.log 2>&1
          if [ "$get_result" -ne 0 ] || [ "$get_status" != 200 ]; then
            printf 'Expected HTTP 200 from GET /\n' >&2
            exit 1
          fi

      - name: Upload PostScript Driver Inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postscript-driver-inventory
          path: inventory/
